name: Test Flatland HMI Frontend and Backend
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ "main" ]
  # Scheduled workflows will only run on the default branch.
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true


jobs:
  build-frontend:
    name: Test Flatland HMI Frontend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node-version: [ "22.x" ]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        working-directory: frontend
        run: |
          npm install
          npm ci
      - name: Run build
        working-directory: frontend
        run: |
          set -euxo pipefail
          npm run build
  test-backend:
    name: Test Flatland HMI Backend
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.12" ]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # DEPENDENCY SWITH
          # TODO flatland-baselines goes with flatland-rl==4.2.6
          python -m pip install -U git+https://github.com/flatland-association/flatland-rl.git@feature/generator-stations-fix-link
      - name: Run pytest
        working-directory: backend
        run: |
          pytest -s