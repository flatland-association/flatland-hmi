name: Publish Flatland HMI Release

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actionlint:
    name: Lint Workflow Files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Download actionlint
        id: get_actionlint
        # Pinned to actionlint v1.7.12 (immutable commit SHA) - bump both together when upgrading.
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
        shell: bash
      - name: Run actionlint
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  test:
    name: Test Before Release Publish
    if: ${{ needs.release-please.outputs.release_created }}
    needs: [ release-please ]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Use Node.js 22.x
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install backend requirements
        working-directory: backend
        # N.B. this flatland-rl override is duplicated from checks.yml - see CLAUDE.local.md's
        # "Required flatland-rl override" note, which only tracks requirements.txt/Dockerfile/checks.yml;
        # update both places if the override branch changes again.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # DEPENDENCY SWITH
          # TODO flatland-baselines goes with flatland-rl==4.2.6
          python -m pip install -U git+https://github.com/flatland-association/flatland-rl.git@main
      - name: Run backend pytest
        working-directory: backend
        run: pytest -s

  docker-publish-frontend:
    name: Publish Flatland HMI Frontend Image
    needs: [ release-please, test ]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Container Image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/flatland-association/flatland-hmi-frontend:${{ needs.release-please.outputs.tag_name }}

  docker-publish-backend:
    name: Publish Flatland HMI Backend Image
    needs: [ release-please, test ]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Container Image
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/flatland-association/flatland-hmi-backend:${{ needs.release-please.outputs.tag_name }}
