name: Build Flatland HMI Frontend and Backend
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image Tag'
        required: true

  # Scheduled workflows will only run on the default branch.
  schedule:
    - cron: '30 5 * * *'

jobs:
  build-frontend:
    name: Build Flatland HMI Frontend
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Evaluate tag
        run: |
          echo "TAG=${{ github.event.inputs.tag || 'latest' }}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/flatland-association/flatland-hmi-frontend:${{ env.TAG }}

  build-backend:
    name: Build Flatland HMI backend
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Evaluate tag
        run: |
          echo "TAG=${{ github.event.inputs.tag || 'latest' }}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and Push Container Image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: Dockerfile
          platforms: linux/amd64,linux/arm64/v8
          push: true
          tags: |
            ghcr.io/flatland-association/flatland-hmi-backend:${{ env.TAG }}