<app-replay-badge></app-replay-badge>

<div class="time-controls">
  <button type="button" (click)="scrollUp()" [disabled]="scrollOffset <= 0" title="Scroll to earlier times">&#9650;</button>
  <input
    class="time-scrollbar"
    type="range"
    min="0"
    [max]="maxScrollOffset"
    [step]="timeGridStep"
    [ngModel]="scrollOffset"
    (ngModelChange)="onScrollInput($event)"
  />
  <button type="button" (click)="scrollDown()" [disabled]="scrollOffset >= maxScrollOffset" title="Scroll to later times">&#9660;</button>
  <button type="button" class="live-button" (click)="jumpToNow()" [disabled]="autoFollow" title="Jump back to NOW">Live</button>
  <label class="visible-steps">
    Show
    <input type="number" min="10" [step]="timeGridStep" [ngModel]="visibleTimeSteps" (ngModelChange)="setVisibleTimeSteps($event)" />
    steps
  </label>
</div>

<svg [attr.viewBox]="'0 0 ' + svgWidth + ' ' + svgHeight">
  <!-- Grid lines -->
  <!-- Vertical grid lines (distance) -->
  <g stroke="#e9ecef" stroke-width="0.5">
    <line [attr.x1]="marginLeft" [attr.y1]="marginTop" [attr.x2]="marginLeft" [attr.y2]="svgHeight - marginBottom" />
    <line
      [attr.x1]="marginLeft + chartWidth * 0.2"
      [attr.y1]="marginTop"
      [attr.x2]="marginLeft + chartWidth * 0.2"
      [attr.y2]="svgHeight - marginBottom"
    />
    <line
      [attr.x1]="marginLeft + chartWidth * 0.4"
      [attr.y1]="marginTop"
      [attr.x2]="marginLeft + chartWidth * 0.4"
      [attr.y2]="svgHeight - marginBottom"
    />
    <line
      [attr.x1]="marginLeft + chartWidth * 0.6"
      [attr.y1]="marginTop"
      [attr.x2]="marginLeft + chartWidth * 0.6"
      [attr.y2]="svgHeight - marginBottom"
    />
    <line
      [attr.x1]="marginLeft + chartWidth * 0.8"
      [attr.y1]="marginTop"
      [attr.x2]="marginLeft + chartWidth * 0.8"
      [attr.y2]="svgHeight - marginBottom"
    />
    <line
      [attr.x1]="marginLeft + chartWidth"
      [attr.y1]="marginTop"
      [attr.x2]="marginLeft + chartWidth"
      [attr.y2]="svgHeight - marginBottom"
    />
  </g>

  <!-- Horizontal grid lines (time), fixed every timeGridStep timesteps within the visible window -->
  <g stroke="#e9ecef" stroke-width="0.5">
    @for (tick of timeTicks; track tick) {
      <line
        [attr.x1]="marginLeft"
        [attr.y1]="timeToY(tick)"
        [attr.x2]="marginLeft + chartWidth"
        [attr.y2]="timeToY(tick)"
      />
    }
  </g>

  <!-- Axes -->
  <!-- Y-axis (Time) -->
  <line
    [attr.x1]="marginLeft"
    [attr.y1]="marginTop"
    [attr.x2]="marginLeft"
    [attr.y2]="svgHeight - marginBottom"
    stroke="#495057"
    stroke-width="2"
  />
  <!-- X-axis (Distance) -->
  <line
    [attr.x1]="marginLeft"
    [attr.y1]="svgHeight - marginBottom"
    [attr.x2]="marginLeft + chartWidth"
    [attr.y2]="svgHeight - marginBottom"
    stroke="#495057"
    stroke-width="2"
  />

  <!-- Axis labels -->
  <!-- Y-axis labels (Time), fixed every timeGridStep timesteps within the visible window -->
  <g fill="#495057" font-family="Arial, sans-serif" font-size="12" text-anchor="end">
    @for (tick of timeTicks; track tick) {
      <text [attr.x]="marginLeft - 10" [attr.y]="timeToY(tick) + 5">{{ tick }}</text>
    }
  </g>

  <!-- X-axis labels (Distance) -->
  <g fill="#495057" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text [attr.x]="marginLeft" [attr.y]="svgHeight - marginBottom + 20">0</text>
    <text [attr.x]="marginLeft + chartWidth * 0.2" [attr.y]="svgHeight - marginBottom + 20">
      {{ maxDistance * 0.2 | number: '1.0' }}
    </text>
    <text [attr.x]="marginLeft + chartWidth * 0.4" [attr.y]="svgHeight - marginBottom + 20">
      {{ maxDistance * 0.4 | number: '1.0' }}
    </text>
    <text [attr.x]="marginLeft + chartWidth * 0.6" [attr.y]="svgHeight - marginBottom + 20">
      {{ maxDistance * 0.6 | number: '1.0' }}
    </text>
    <text [attr.x]="marginLeft + chartWidth * 0.8" [attr.y]="svgHeight - marginBottom + 20">
      {{ maxDistance * 0.8 | number: '1.0' }}
    </text>
    <text [attr.x]="marginLeft + chartWidth" [attr.y]="svgHeight - marginBottom + 20">
      {{ maxDistance | number: '1.0-1' }}
    </text>
  </g>

  <!-- Station and line labels -->
  <text [attr.x]="marginLeft" [attr.y]="svgHeight - marginBottom + 35"
        fill="#495057" font-family="Arial, sans-serif" font-size="11" text-anchor="start">{{ fromGate }}
  </text>
  <text [attr.x]="marginLeft + chartWidth" [attr.y]="svgHeight - marginBottom + 35"
        fill="#495057" font-family="Arial, sans-serif" font-size="11" text-anchor="end">{{ toGate }}
  </text>

  <!-- NOW line (current time step) -->
  @if (timestep > 0) {
    <g>
      <line
        [attr.x1]="marginLeft"
        [attr.y1]="nowY"
        [attr.x2]="marginLeft + chartWidth"
        [attr.y2]="nowY"
        stroke="#2e9e44"
        stroke-width="1.5"
      />
      <text
        [attr.x]="marginLeft + chartWidth + 4"
        [attr.y]="nowY + 4"
        fill="#2e9e44"
        font-family="Arial, sans-serif"
        font-size="11"
        text-anchor="start"
      >NOW
      </text>
    </g>
  }

  <!-- REPLAY line (time machine position) -->
  @if (replayTime !== null) {
    <g>
      <line
        [attr.x1]="marginLeft"
        [attr.y1]="replayY"
        [attr.x2]="marginLeft + chartWidth"
        [attr.y2]="replayY"
        stroke="#c0392b"
        stroke-width="1.5"
      />
      <text
        [attr.x]="marginLeft + chartWidth + 4"
        [attr.y]="replayY + 4"
        fill="#c0392b"
        font-family="Arial, sans-serif"
        font-size="11"
        text-anchor="start"
      >REPLAY
      </text>
    </g>
  }

  <!-- Planned trajectories -->
  @for (plan of plannedRuns; let i = $index; track $index) {
    @for (train of plan; track $index) {
      <path
        [attr.d]="getPolylinePath(train.coordinates)"
        [attr.stroke]="this.selectedPlan === i ? 'grey' : '#cccccc99'"
        fill="none"
        stroke-width="3"
        opacity="0.8"
      />
    }
    @for (label of getPlanLabels(plan); track $index) {
    <text
      [attr.x]="label.x + 3"
      [attr.y]="label.y + 4"
      font-family="Arial, sans-serif"
      font-size="9"
      fill="#888"
    >{{ label.label }}
    </text>
    }
  }

  <!-- Train trajectories -->
  @for (train of trainRuns; let i = $index; track $index) {
    <filter [id]="'hue-rotate-' + i">
      <feColorMatrix type="hueRotate" [attr.values]="(i / trainRuns.length) * 360" />
    </filter>
    <g>
      <path
        [attr.d]="getPolylinePath(train.coordinates)"
        fill="none"
        stroke="red"
        stroke-width="3"
        opacity="0.8"
        [attr.style]="'filter: url(#hue-rotate-' + i + ')'"
      />
      @for (endPoint of getPolylineSegmentEndPoints(train.coordinates); track $index) {
      <text
        [attr.x]="endPoint.x + 3"
        [attr.y]="endPoint.y + 4"
        font-family="Arial, sans-serif"
        font-size="9"
        fill="#333"
        [attr.style]="'filter: url(#hue-rotate-' + i + ')'"
      >{{ train.name }}
      </text>
      }
    </g>
  }
</svg>
